<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Light.ttf);font-weight:300}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#060607}
body{font-family:P,'FreeSans',sans-serif;color:#F4F1EA}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 900px 700px at 50% 42%,rgba(201,168,76,.16),transparent 70%),linear-gradient(180deg,#0C0C0D,#060607)}
#grid{position:absolute;inset:-100px;background-image:linear-gradient(rgba(201,168,76,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.05) 1px,transparent 1px);background-size:90px 90px}
#kicker{position:absolute;top:230px;left:0;right:0;text-align:center;font-weight:700;letter-spacing:14px;font-size:30px;color:#C9A84C}
#kicker:after{content:"";display:block;width:70px;height:3px;background:#FC8C00;margin:18px auto 0}
#bar{position:absolute;bottom:300px;left:120px;right:120px;height:5px;background:rgba(255,255,255,.08);border-radius:3px}
#barfill{height:100%;background:linear-gradient(90deg,#C9A84C,#FC8C00);border-radius:3px;width:0}
.scene{position:absolute;left:90px;right:90px;top:360px;bottom:360px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;opacity:0}
.a{opacity:0}
.big{font-weight:700;font-size:150px;line-height:1;color:#E8C97A;letter-spacing:-3px}
.h{font-weight:700;font-size:84px;line-height:1.12;letter-spacing:-1px}
.m{font-weight:500;font-size:56px;line-height:1.25}
.s{font-weight:400;font-size:44px;line-height:1.4;color:#CFC9BC}
.xs{font-weight:300;font-size:30px;color:#8E887C}
.gold{color:#E8C97A}.or{color:#FC8C00}
.gap{height:44px}.gap2{height:24px}
.pill{display:inline-block;border:2px solid #C9A84C;color:#E8C97A;border-radius:60px;padding:14px 40px;font-weight:600;font-size:40px}
.quote{font-weight:300;font-style:normal;font-size:70px;line-height:1.25}
svg{display:block;margin:0 auto}
.opt{display:flex;align-items:center;gap:30px;width:880px;margin:16px 0;padding:30px 40px;border:2px solid rgba(201,168,76,.5);border-radius:26px;background:rgba(201,168,76,.06);text-align:left;font-weight:600;font-size:52px;transition:none}
.opt b{display:inline-flex;align-items:center;justify-content:center;min-width:76px;height:76px;border-radius:50%;background:#C9A84C;color:#060607;font-size:42px}
.opt.on{background:linear-gradient(90deg,#C9A84C,#E8C97A);color:#060607;border-color:#E8C97A}
.opt.on b{background:#060607;color:#E8C97A}
.opt.off{opacity:.3}
.win{position:absolute;left:0;right:0;opacity:0}
.cd{position:relative;height:300px;width:100%}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45) 100%)}
.scene{top:330px!important;bottom:auto!important;height:620px;justify-content:flex-start!important;padding-top:30px}
.scene *{text-shadow:0 4px 24px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.55)}
.place{font-weight:700;letter-spacing:12px;font-size:40px;color:#E8C97A}
.place:before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:#FC8C00;margin-right:20px;vertical-align:middle;position:relative;top:-4px}
.scene.center{justify-content:center!important;top:360px!important;height:1200px}
</style></head><body>
<div id="bg" style="display:none"></div><div id="grid" style="display:none"></div><svg id="world" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0"></svg><div id="shade"></div><div id="dark" style="position:absolute;inset:0;background:#05070c;opacity:0"></div>
<div id="kicker">TRADE INVEST</div>
<div id="scenes"></div>
<div id="bar"><div id="barfill"></div></div>
<script>
const ease=p=>1-Math.pow(1-p,3);
const cl=x=>Math.max(0,Math.min(1,x));
let SC=[],TOTAL=0;
function setup(cfg){
  const root=document.getElementById('scenes');
  let t0=0;
  cfg.scenes.forEach(s=>{const d=document.createElement('div');d.className='scene'+(s.cls?' '+s.cls:'');d.innerHTML=s.html;root.appendChild(d);SC.push({el:d,start:t0,dur:s.dur});t0+=s.dur;});
  TOTAL=t0;
  if(cfg.noBar) document.getElementById('bar').style.display='none';
  return TOTAL;
}
function fmt(v,dec,sep){let s=v.toFixed(dec).replace('.',',');let [i,f]=s.split(',');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return f?i+','+f:i}
function render(t){
  document.getElementById('grid').style.transform=`translateY(${-(t*6)%90}px)`;
  document.getElementById('bg').style.transform=`scale(${1+0.04*Math.sin(t/4)})`;
  document.getElementById('barfill').style.width=(cl(t/TOTAL)*100)+'%';
  SC.forEach((s,i)=>{
    const lt=t-s.start;
    const first=i===0,last=i===SC.length-1;
    let o=0;
    if(lt>=0&&lt<s.dur){o=1; if(!first) o=Math.min(o,cl(lt/0.12)); if(!last) o=Math.min(o,cl((s.dur-lt)/0.12));}
    s.el.style.opacity=o;
    s.el.style.transform=`scale(${1+0.025*cl(lt/s.dur)})`;
    if(o<=0)return;
    s.el.querySelectorAll('.a').forEach(e=>{
      const d=parseFloat(e.dataset.d||0);const p=ease(cl((lt-d)/0.3));
      e.style.opacity=p;e.style.transform=e.classList.contains("p")?`scale(${1+0.6*(1-p)})`:`translateY(${(1-p)*60}px)`;
    });
    s.el.querySelectorAll('[data-from]').forEach(e=>{
      const d=parseFloat(e.dataset.cd||0),dur=parseFloat(e.dataset.cdur||1.2);
      const p=ease(cl((lt-d)/dur));const v=+e.dataset.from+(+e.dataset.to-+e.dataset.from)*p;
      e.textContent=(e.dataset.pre||'')+fmt(v,+(e.dataset.dec||0))+(e.dataset.suf||'');
    });
    s.el.querySelectorAll('[data-on]').forEach(e=>e.classList.toggle('on',lt>=+e.dataset.on));
    s.el.querySelectorAll('[data-off]').forEach(e=>e.classList.toggle('off',lt>=+e.dataset.off));
    s.el.querySelectorAll('[data-win]').forEach(e=>{const [a,b]=e.dataset.win.split(',').map(Number);const v=lt>=a&&lt<b;const p=v?ease(cl((lt-a)/0.2)):0;e.style.opacity=v?1:0;e.style.transform=`scale(${1.5-0.5*p})`;});
    s.el.querySelectorAll('[data-draw]').forEach(e=>{
      const d=parseFloat(e.dataset.draw);const L=+e.dataset.len;const p=ease(cl((lt-d)/1.3));
      e.style.strokeDasharray=L;e.style.strokeDashoffset=L*(1-p);
    });
  });
}
</script><script>
(function(){
const W=document.getElementById('world');let h='';
h+=`<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a38"/><stop offset=".45" stop-color="#5a3a5e"/><stop offset=".78" stop-color="#d0744a"/><stop offset="1" stop-color="#f6c27a"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4a5a"/><stop offset=".25" stop-color="#14465a"/><stop offset="1" stop-color="#062430"/></linearGradient>
<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff2c8"/><stop offset=".25" stop-color="#ffc870" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a40" stop-opacity="0"/></radialGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dca0"/><stop offset="1" stop-color="#c9a24c"/></linearGradient>
<linearGradient id="refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf80" stop-opacity=".75"/><stop offset="1" stop-color="#ffcf80" stop-opacity="0"/></linearGradient>
</defs>`;
const HZ=720;
h+=`<g id="cam">`;
h+=`<rect x="-200" y="-200" width="1480" height="${HZ+200}" fill="url(#sky)"/>`;
h+=`<circle id="sunc" cx="300" cy="${HZ-10}" r="260" fill="url(#sun)"/>`;
h+=`<rect x="-200" y="${HZ}" width="1480" height="1500" fill="url(#sea)"/>`;
h+=`<path d="M270,${HZ} L330,${HZ} L380,1250 L220,1250 Z" fill="url(#refl)" opacity=".35"/>`;
// skyline
let x=-60,sk='';const rnd=(i)=>{const v=Math.sin(i*12.9898)*43758.5453;return v-Math.floor(v)};let i=0;
while(x<1160){const w=24+rnd(i)*40,hh=25+rnd(i+7)*110;sk+=`<rect x="${x}" y="${HZ-hh}" width="${w}" height="${hh+2}" fill="#1b1424"/>`;
 for(let k=0;k<4;k++){if(rnd(i*5+k)>.55)sk+=`<rect class="win" x="${x+4+rnd(i+k)*(w-8)}" y="${HZ-hh+8+rnd(i*3+k)*(hh-14)}" width="5" height="7" fill="#ffd27a"/>`}
 x+=w+2;i++;}
// iconic needle tower
sk+=`<path d="M752,${HZ} L752,${HZ-200} L760,${HZ-200} L762,${HZ-330} L768,${HZ-330} L770,${HZ-430} L774,${HZ-520} L778,${HZ-430} L780,${HZ-330} L786,${HZ-330} L788,${HZ-200} L796,${HZ-200} L796,${HZ} Z" fill="#1b1424"/>`;
h+=sk;
// shimmer lines
h+=`<g id="shim">`;for(let j=0;j<40;j++){const y=HZ+20+j*28,xx=rnd(j+50)*1080;h+=`<rect x="${xx}" y="${y}" width="${40+rnd(j)*90}" height="3" rx="1.5" fill="#ffd9a0" opacity="${.12+.25*(1-j/40)}"/>`}h+=`</g>`;
// palm (aerial, perspective squash)
const CX=540,CY=1330,SQ=0.5;let p=`<g transform="translate(${CX},${CY}) scale(1,${SQ})">`;
// crescent
p+=`<path d="M${-600*Math.cos(0.25)},${-600*Math.sin(0.25)} A600,600 0 0,1 ${600*Math.cos(0.25)},${-600*Math.sin(0.25)}" fill="none" stroke="url(#sand)" stroke-width="38" stroke-linecap="round"/>`;
// trunk
p+=`<rect x="-26" y="-80" width="52" height="420" rx="20" fill="url(#sand)"/>`;
let lights='';
const N=17;for(let k=0;k<N;k++){const a=(-84+k*(168/(N-1)))*Math.PI/180,L=430-Math.abs(k-(N-1)/2)*8;
 const ex=Math.sin(a)*L,ey=-80-Math.cos(a)*L;
 p+=`<line x1="0" y1="-60" x2="${ex}" y2="${ey}" stroke="url(#sand)" stroke-width="22" stroke-linecap="round"/>`;
 p+=`<line x1="0" y1="-60" x2="${ex}" y2="${ey}" stroke="#2f6b4a" stroke-width="8" stroke-linecap="round" opacity=".55"/>`;
 for(let q=3;q<12;q++){const f=q/12;lights+=`<circle class="lt" data-ph="${k*1.7+q}" cx="${ex*f}" cy="${-60+(ey+60)*f}" r="5" fill="#ffe2a0"/>`}}
p+=lights;
// crescent lights
for(let k=0;k<26;k++){const a=Math.PI+0.25+k*(Math.PI-0.5)/25;p+=`<circle class="lt" data-ph="${k*2.3}" cx="${600*Math.cos(a)}" cy="${600*Math.sin(a)}" r="6" fill="#ffd27a"/>`}
p+=`</g>`;h+=p;
h+=`</g>`;
W.innerHTML=h;
const cam=document.getElementById('cam'),shim=document.getElementById('shim'),lts=[...W.querySelectorAll('.lt')],wins=[...W.querySelectorAll('.win')];
window.bgUpdate=function(t){
 const z=1.06+0.10*(t/22);cam.setAttribute('transform',`translate(540,1100) scale(${z}) translate(${-540+ t*2.2},-1100)`);
 shim.setAttribute('transform',`translate(${(t*18)%60-30},0)`);
 lts.forEach(e=>{const ph=+e.dataset.ph;e.setAttribute('opacity',(0.55+0.45*Math.sin(t*2.2+ph)).toFixed(2))});
 document.getElementById('dark').style.opacity=(Math.max(0,Math.min(1,(t-(TOTAL-3.8))/0.6))*0.62).toFixed(3);
 wins.forEach((e,j)=>e.setAttribute('opacity',(0.5+0.5*Math.sin(t*1.3+j)).toFixed(2)));
};
const _r=window.render;window.render=function(t){bgUpdate(t);_r(t)};
})();
</script></body></html>
